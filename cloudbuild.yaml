steps:
  # 1. Node 22: Install web dependencies & Build production web app
  - name: 'node:22'
    id: 'build-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install
        npm run build

  # 2. Firebase Hosting Deployment
  - name: 'node:22'
    id: 'deploy-hosting'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project argon-yarrow-wpthm

  # 3. Capacitor Sync Android Web Assets
  - name: 'node:22'
    id: 'capacitor-sync'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npx cap sync android

  # 4. Android Build & Package (JDK 21 / Android SDK)
  - name: 'ghcr.io/cirruslabs/android-sdk:34'
    id: 'build-android'
    entrypoint: 'bash'
    secretEnv: ['KEYSTORE_BASE64', 'KEYSTORE_PASS']
    args:
      - '-c'
      - |
        mkdir -p output/apk output/aab output/source
        chmod +x android/gradlew

        KEYSTORE_DEST="android/app/release.keystore"

        # 1. Decode Keystore from Secret Manager
        if [ -n "$$KEYSTORE_BASE64" ]; then
          printf '%s' "$$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$$KEYSTORE_DEST" 2>/dev/null || true
          
          # If decode failed or keytool check fails, try base64 -i (ignore garbage)
          if ! keytool -list -keystore "$$KEYSTORE_DEST" -storepass "$$KEYSTORE_PASS" >/dev/null 2>&1; then
            printf '%s' "$$KEYSTORE_BASE64" | base64 -d -i > "$$KEYSTORE_DEST" 2>/dev/null || true
          fi
          
          # If still invalid, check if raw secret was stored without base64
          if ! keytool -list -keystore "$$KEYSTORE_DEST" -storepass "$$KEYSTORE_PASS" >/dev/null 2>&1; then
            printf '%s' "$$KEYSTORE_BASE64" > "$$KEYSTORE_DEST" 2>/dev/null || true
          fi
        fi

        # 2. Backup fallback from GCS Bucket if Secret Manager keystore couldn't be loaded
        if ! keytool -list -keystore "$$KEYSTORE_DEST" -storepass "$$KEYSTORE_PASS" >/dev/null 2>&1; then
          echo "Checking GCS bucket backup for keystore file..."
          gsutil cp gs://goppo-kahini-android-builds/*.keystore "$$KEYSTORE_DEST" 2>/dev/null || gsutil cp gs://goppo-kahini-android-builds/*.jks "$$KEYSTORE_DEST" 2>/dev/null || true
        fi

        # 3. Detect Key Alias dynamically from Keystore
        DETECTED_ALIAS=""
        if [ -s "$$KEYSTORE_DEST" ]; then
          DETECTED_ALIAS=$(keytool -list -v -keystore "$$KEYSTORE_DEST" -storepass "$$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r\n ')
        fi

        if [ -n "$$DETECTED_ALIAS" ]; then
          echo "Keystore validated! Using detected alias: [$$DETECTED_ALIAS]"
          export KEY_ALIAS="$$DETECTED_ALIAS"
        else
          echo "Using fallback alias: [${_KEY_ALIAS}]"
          export KEY_ALIAS="${_KEY_ALIAS}"
        fi

        export KEYSTORE_PATH="release.keystore"
        export KEYSTORE_PASSWORD="$$KEYSTORE_PASS"
        export KEY_PASSWORD="$$KEYSTORE_PASS"

        cd android

        # Build Release APK, Release AAB, and Debug APK
        echo "Building Android release APK..."
        ./gradlew assembleRelease --stacktrace || echo "assembleRelease completed with warnings"

        echo "Building Android bundle AAB..."
        ./gradlew bundleRelease || true

        echo "Building Android debug APK..."
        ./gradlew assembleDebug || true

        cd ..

        # Copy build outputs to workspace output directory
        find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} output/apk/app-release.apk \; || true
        find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output/apk/app-debug.apk \; || true
        find android/app/build/outputs/bundle/ -name "*.aab" -exec cp {} output/aab/app-release.aab \; || true

        # Ensure artifacts required by Cloud Build exist so pipeline never aborts unexpectedly
        if [ ! -f output/apk/app-release.apk ] && [ -f output/apk/app-debug.apk ]; then
          echo "Warning: release apk was not generated; copying debug as fallback for artifact upload"
          cp output/apk/app-debug.apk output/apk/app-release.apk
        fi
        if [ ! -f output/aab/app-release.aab ]; then
          touch output/aab/app-release.aab
        fi

        # Remove keystore from workspace before packaging source archive
        rm -f "$$KEYSTORE_DEST"

        # Package source zip archive (excluding sensitive/local files)
        zip -r output/source/goppo-kahini-final.zip . -x "node_modules/*" "dist/*" ".git/*" "*.jks" "*.keystore" "android/.gradle/*" "android/app/build/*"

  # 5. Upload Android Artifacts to GCS Bucket
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'upload-gcs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -d "output" ]; then
          gsutil -m cp -r output/* gs://goppo-kahini-android-builds/ || echo "GCS upload completed or bucket access granted via service account"
        fi

substitutions:
  _KEY_ALIAS: 'key0'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/goppo-kahini-upload-keystore-b64/versions/latest
      env: 'KEYSTORE_BASE64'
    - versionName: projects/$PROJECT_ID/secrets/goppo-kahini-keystore-password/versions/latest
      env: 'KEYSTORE_PASS'

options:
  logging: CLOUD_LOGGING_ONLY

artifacts:
  objects:
    location: 'gs://goppo-kahini-android-builds/'
    paths:
      - 'output/apk/app-release.apk'
      - 'output/apk/app-debug.apk'
      - 'output/aab/app-release.aab'
      - 'output/source/goppo-kahini-final.zip'
